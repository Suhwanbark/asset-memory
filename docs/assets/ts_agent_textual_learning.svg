  <text x="774" y="345" class="body" font-weight="700">TS Reason</text>
  <text x="733" y="387" class="body">Hypothesis state</text>
  <text x="733" y="418" class="body">Evidence · Status</text>

  <rect x="961" y="301" width="185" height="136" rx="13" fill="#fff" stroke="#c5d7e9"/>
