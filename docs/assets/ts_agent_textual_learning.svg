  <text x="545" y="345" class="body" font-weight="700">Observe</text>
  <text x="506" y="387" class="body">Time series</text>
  <text x="506" y="418" class="body">Tool results</text>

  <rect x="717" y="301" width="197" height="136" rx="13" fill="#e5effd" stroke="#80a8d5" stroke-width="1.5"/>
