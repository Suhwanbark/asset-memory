  <!-- Outer loop: improve the harness using development-task feedback. -->
  <rect x="40" y="745" width="1600" height="325" rx="22" fill="#fbf8fe" stroke="#e4d8ed" stroke-width="1.5"/>
  <text x="78" y="790" class="section" style="fill:#8051a5">02  Textual learning loop</text>
