  <path d="M1045 597V642H577V451" class="blue-flow" marker-end="url(#blue)"/>
  <text x="815" y="673" text-anchor="middle" class="body" style="fill:#2566a8">New observations</text>

  <rect x="1250" y="283" width="330" height="273" rx="16" fill="#fff" stroke="#abc4df" stroke-width="1.5"/>
  <use href="#log" x="1269" y="311" width="40" height="40" style="color:#2566a8"/>
  <text x="1320" y="340" class="label">Trajectory</text>
  <text x="1276" y="390" class="body">Tool calls · Evidence</text>
  <path d="M1276 414H1554" stroke="#e0e8f1"/>
  <text x="1276" y="480" class="body" font-weight="700">Final answer</text>
