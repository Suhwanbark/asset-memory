<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1170" viewBox="0 0 1680 1170" role="img" aria-labelledby="title desc">
  <title id="title">Learning to Explore with TS-grep</title>
  <desc id="desc">Keyword-only view of a proposed architecture. A task and textual harness guide a frozen agent through Observe, TS Reason, and Act. TS Reason maintains hypothesis state with evidence and verification status. Actions query ts-grep and a financial time-series corpus; observations feed the execution loop. Trajectories are assessed, critiqued by a coach, and used to propose harness updates. Paired evaluation accepts or rejects updates. This figure describes a proposal, not an implemented training result.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" fill="#62768c"/></marker>
    <marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" fill="#2566a8"/></marker>
    <marker id="purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" fill="#8051a5"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #203247; }
      .title { font-size: 40px; font-weight: 700; }
      .subtitle { font-size: 24px; }
      .section { font-size: 26px; font-weight: 700; }
      .label { font-size: 23px; font-weight: 700; }
      .body { font-size: 22px; }
      .eyebrow { font-size: 15px; font-weight: 700; letter-spacing: 1.5px; }
      .flow { fill: none; stroke: #62768c; stroke-width: 2.8; stroke-linecap: round; stroke-linejoin: round; }
      .blue-flow { fill: none; stroke: #2566a8; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .purple-flow { fill: none; stroke: #8051a5; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .icon { fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <symbol id="document" viewBox="0 0 40 40"><g class="icon"><path d="M10 4h15l7 7v25H8V4zM25 4v9h7M13 20h14M13 26h14M13 32h9"/></g></symbol>
    <symbol id="robot" viewBox="0 0 40 40"><g class="icon"><rect x="6" y="12" width="28" height="23" rx="6"/><path d="M20 6v6M2 20v8M38 20v8M15 29h10"/><circle cx="20" cy="4" r="2"/><circle cx="14" cy="21" r="2"/><circle cx="26" cy="21" r="2"/></g></symbol>
    <symbol id="chart" viewBox="0 0 40 40"><g class="icon"><path d="M5 5v29h31M9 25l7-9 7 4 10-13M9 29l7-5 7 3 10-7"/></g></symbol>
    <symbol id="network" viewBox="0 0 40 40"><g class="icon"><circle cx="8" cy="12" r="4"/><circle cx="31" cy="8" r="4"/><circle cx="21" cy="30" r="4"/><path d="M12 12l15-3M10 16l8 10M29 12l-6 14"/></g></symbol>
    <symbol id="search" viewBox="0 0 40 40"><g class="icon"><circle cx="17" cy="16" r="11"/><path d="M25 25l11 11M11 17h4l3-6 4 10"/></g></symbol>
    <symbol id="database" viewBox="0 0 40 40"><g class="icon"><ellipse cx="20" cy="8" rx="14" ry="5"/><path d="M6 8v24c0 7 28 7 28 0V8M6 20c0 7 28 7 28 0"/></g></symbol>
    <symbol id="log" viewBox="0 0 40 40"><g class="icon"><rect x="5" y="4" width="30" height="32" rx="4"/><path d="M18 13h11M18 21h11M18 29h11M10 12l2 2 3-4M10 20l2 2 3-4M10 28l2 2 3-4"/></g></symbol>
    <symbol id="feedback" viewBox="0 0 40 40"><g class="icon"><path d="M6 5h28v24H18l-9 7v-7H6zM12 12h16M12 18h16M12 24h8"/></g></symbol>
    <symbol id="pencil" viewBox="0 0 40 40"><g class="icon"><path d="M8 29l-2 8 8-2L35 14 27 6zM23 10l8 8M8 29l6 6M7 7h10M7 14h6"/></g></symbol>
    <symbol id="check" viewBox="0 0 40 40"><g class="icon"><circle cx="20" cy="20" r="16"/><path d="M11 20l6 6 13-14"/></g></symbol>
  </defs>

  <rect width="1680" height="1170" fill="#fff"/>
  <text x="60" y="66" class="title">Learning to Explore with TS-grep</text>
  <text x="60" y="108" class="subtitle">Execution · Hypothesis state · Textual optimization</text>
  <rect x="1290" y="35" width="330" height="42" rx="21" fill="#f0eafa"/>
  <text x="1455" y="62" text-anchor="middle" class="eyebrow" style="fill:#8051a5">PROPOSED DESIGN</text>

